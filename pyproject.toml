# Repo-level tooling config for AgentGuard Enterprise v3.1.
# Scope: developer tooling only (pytest path wiring). This is NOT a packaging or
# deployment decision; a proper workspace layout is a shared item with Developer B.
[tool.pytest.ini_options]
pythonpath = [
    "packages/domain/src",
    "packages/contracts/src",
    "packages/policy/src",
    "apps/runtime-gateway/src",
]
testpaths = ["tests", "apps/runtime-gateway/tests"]
