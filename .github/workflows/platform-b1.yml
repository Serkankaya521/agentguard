name: Platform P0-P3 and MVP verification
on: [push, pull_request]
jobs:
  tenant-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: b1_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      B1_TEST_OWNER_DSN: host=127.0.0.1 dbname=b1_test user=postgres
      B1_TEST_APP_DSN: host=127.0.0.1 dbname=b1_test user=ag_control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/control-api/requirements-dev.txt
      - run: pip install -r dashboard/requirements-local.txt
      - name: Create restricted application role in disposable service
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['B1_TEST_OWNER_DSN']) as conn:
              conn.execute('CREATE ROLE ag_control LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOINHERIT')
          PY
      - name: pytest
        run: |
          set +e
          python -m pytest -rA -q 2>&1 | tee /tmp/pt.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -nE "^FAILED |^ERROR |short test summary" /tmp/pt.txt | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - run: python -m compileall -q apps packages dashboard core tests benchmarks migrations
      - name: Validate deployment YAML
        run: python -c "import pathlib,yaml; files=list(pathlib.Path('infra').rglob('*.y*ml'))+list(pathlib.Path('.github').rglob('*.y*ml')); [list(yaml.safe_load_all(p.read_text())) for p in files]; print(len(files))"
  web-console:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web-console}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web-console/package-lock.json}
      - name: npm ci
        run: |
          set +e; npm ci --ignore-scripts 2>&1 | tee /tmp/ci.txt; code=${PIPESTATUS[0]}
          [ $code -ne 0 ] && grep -nE "npm error|error|ETARGET|ERESOLVE" /tmp/ci.txt | tail -20 | while IFS= read -r l; do echo "::error::ci: $l"; done
          exit $code
      - name: npm audit
        run: |
          set +e
          npm audit --json > /tmp/au.json 2>/dev/null
          node -e "const a=(require('/tmp/au.json').vulnerabilities)||{};for(const[k,v]of Object.entries(a)){if(['high','critical'].includes(v.severity)){const via=(v.via||[]).map(x=>typeof x==='string'?x:(x.title||x.name)).join(' | ');console.log('::error::audit '+v.severity+' '+k+' range='+v.range+' fix='+JSON.stringify(v.fixAvailable)+' via='+via)}}" 2>/dev/null
          npm audit --audit-level=high
          exit $?
      - name: typecheck
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/tc.txt
          code=${PIPESTATUS[0]}
          [ $code -ne 0 ] && grep -nE "error TS|: error|Error" /tmp/tc.txt | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
      - name: build
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/bd.txt
          code=${PIPESTATUS[0]}
          [ $code -ne 0 ] && grep -nE "error|Error|Failed|Module not found|Type error|./src" /tmp/bd.txt | tail -40 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code
