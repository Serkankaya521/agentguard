receivers:
  otlp:
    protocols: {grpc: {}, http: {}}
processors:
  memory_limiter: {limit_mib: 256, spike_limit_mib: 64, check_interval: 1s}
  batch: {send_batch_size: 512, timeout: 5s}
  attributes/redact:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.body, action: delete}
      - {key: db.statement, action: delete}
exporters:
  debug: {verbosity: basic}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [debug]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug]}
