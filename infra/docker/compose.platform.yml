services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 3s, retries: 20}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [backend]
  redis-primary:
    image: bitnami/redis:8.2
    environment: [ALLOW_EMPTY_PASSWORD=no, REDIS_PASSWORD_FILE=/run/secrets/redis_password]
    secrets: [redis_password]
    networks: [backend]
  redis-replica-1:
    image: bitnami/redis:8.2
    environment: [ALLOW_EMPTY_PASSWORD=no, REDIS_REPLICATION_MODE=slave, REDIS_MASTER_HOST=redis-primary, REDIS_MASTER_PASSWORD_FILE=/run/secrets/redis_password, REDIS_PASSWORD_FILE=/run/secrets/redis_password]
    secrets: [redis_password]
    networks: [backend]
  redis-replica-2:
    image: bitnami/redis:8.2
    environment: [ALLOW_EMPTY_PASSWORD=no, REDIS_REPLICATION_MODE=slave, REDIS_MASTER_HOST=redis-primary, REDIS_MASTER_PASSWORD_FILE=/run/secrets/redis_password, REDIS_PASSWORD_FILE=/run/secrets/redis_password]
    secrets: [redis_password]
    networks: [backend]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command: [redpanda, start, --smp, "1", --memory, 1G, --overprovisioned, --node-id, "0", --kafka-addr, PLAINTEXT://0.0.0.0:9092, --advertise-kafka-addr, PLAINTEXT://redpanda:9092]
    networks: [backend]
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001
    environment: [MINIO_ROOT_USER_FILE=/run/secrets/minio_user, MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_password]
    secrets: [minio_user, minio_password]
    volumes: ["object-data:/data"]
    networks: [backend]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    networks: [backend]
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.4.11-alpine
    environment: [CLICKHOUSE_DB=agentguard, CLICKHOUSE_USER=agentguard, CLICKHOUSE_PASSWORD_FILE=/run/secrets/clickhouse_password]
    secrets: [clickhouse_password]
    volumes: ["clickhouse-data:/var/lib/clickhouse", "../clickhouse/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    networks: [backend]
secrets:
  postgres_password: {file: ./secrets/postgres_password.txt}
  redis_password: {file: ./secrets/redis_password.txt}
  minio_user: {file: ./secrets/minio_user.txt}
  minio_password: {file: ./secrets/minio_password.txt}
  clickhouse_password: {file: ./secrets/clickhouse_password.txt}
volumes: {postgres-data: {}, object-data: {}, clickhouse-data: {}}
networks: {backend: {internal: true}}
