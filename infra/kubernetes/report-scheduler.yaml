apiVersion: batch/v1
kind: CronJob
metadata: {name: agentguard-schedule-materializer}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: scheduler
            image: agentguard/platform-worker:3.1.0
            command: [python, apps/worker/src/schedule_main.py]
            envFrom: [{secretRef: {name: agentguard-platform-runtime}}]
            resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 250m, memory: 256Mi}}
            securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
